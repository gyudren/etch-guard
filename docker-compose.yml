services:
  etchguard:
    build: .
    image: etchguard:3.0
    ports:
      - "127.0.0.1:${ETCH_PORT:-8000}:8000"
    environment:
      MODEL_SOURCE: mlflow
      LOADING_MODE: eager
      DEMO_SEED: ${DEMO_SEED:-0}   # DEMO_SEED=1 docker compose up -d 로 발표용 데모 데이터를 채움
    volumes:
      - etchguard-logs:/app/logs   # aiops.log는 컨테이너 재생성 후에도 유지
volumes:
  etchguard-logs:
